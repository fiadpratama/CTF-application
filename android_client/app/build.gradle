plugins {
    id 'com.android.application'
}

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { stream ->
        keystoreProperties.load(stream)
    }
}
def hasReleaseKeystore = keystorePropertiesFile.exists() &&
    keystoreProperties['storeFile']?.toString()?.trim() &&
    keystoreProperties['storePassword']?.toString()?.trim() &&
    keystoreProperties['keyAlias']?.toString()?.trim() &&
    keystoreProperties['keyPassword']?.toString()?.trim() &&
    file(keystoreProperties['storeFile']).exists()
def requireReleaseKeystore = project.hasProperty('requireReleaseKeystore') &&
    project.property('requireReleaseKeystore').toString().toBoolean()
if (requireReleaseKeystore && !hasReleaseKeystore) {
    throw new GradleException("Release keystore is required (-PrequireReleaseKeystore=true), but keystore.properties or storeFile is missing.")
}

android {
    namespace 'io.github.fiadpratama.ctfapplication'
    compileSdk 36
    buildToolsVersion "36.0.0"
    ndkVersion "26.1.10909125"

    defaultConfig {
        applicationId "io.github.fiadpratama.ctfapplication"
        minSdk 26
        targetSdk 36
        versionCode 11
        versionName "2.0.3"

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17 -O3 -fvisibility=hidden -fvisibility-inlines-hidden"
            }
        }
    }

    androidResources {
        noCompress 'bin'
    }

    signingConfigs {
        release {
            if (hasReleaseKeystore) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig hasReleaseKeystore ? signingConfigs.release : signingConfigs.debug
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.core:core-splashscreen:1.0.1'
}

tasks.register('generateNativeKeys', Exec) {
    description = 'Generates C++ native keys header from native-secrets.properties'
    workingDir file("src/main/cpp")
    inputs.file("src/main/cpp/native-secrets.properties")
    inputs.file("src/main/cpp/generate_keys.py")
    outputs.file("src/main/cpp/generated-keys.h")

    boolean isWindows = System.getProperty('os.name').toLowerCase().contains('windows')
    if (isWindows) {
        commandLine 'cmd', '/c', 'py -3 -c "import sys" >nul 2>nul & if errorlevel 1 (python -B generate_keys.py) else (py -3 -B generate_keys.py)'
    } else {
        commandLine 'bash', '-c', 'if command -v python3 >/dev/null 2>&1; then python3 -B generate_keys.py; else python -B generate_keys.py; fi'
    }
}

preBuild.dependsOn generateNativeKeys
