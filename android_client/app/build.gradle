plugins {
    id 'com.android.application'
}

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace 'io.github.fiadpratama.ctfapplication'
    compileSdk 34

    defaultConfig {
        applicationId "io.github.fiadpratama.ctfapplication"
        minSdk 26
        targetSdk 34
        versionCode 8
        versionName "2.0.0"

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17 -O3 -fvisibility=hidden -fvisibility-inlines-hidden"
            }
        }
    }

    androidResources {
        noCompress 'bin'
    }

    signingConfigs {
        release {
            storeFile file(keystoreProperties['storeFile'] ?: 'keystore.jks')
            storePassword keystoreProperties['storePassword']
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.core:core-splashscreen:1.0.1'
}

tasks.register('generateNativeKeys', Exec) {
    description = 'Generates C++ native keys header from native-secrets.properties'
    workingDir file("src/main/cpp")

    boolean isWindows = System.getProperty('os.name').toLowerCase().contains('windows')
    if (isWindows) {
        commandLine 'cmd', '/c', 'py -3 -V >nul 2>nul && py -3 generate_keys.py || python generate_keys.py'
    } else {
        commandLine 'bash', '-c', 'command -v python3 >/dev/null 2>&1 && python3 generate_keys.py || python generate_keys.py'
    }
}

preBuild.dependsOn generateNativeKeys
